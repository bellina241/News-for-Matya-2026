<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פיד החדשות של מתיא</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --primary: #4a90e2;
            --success: #2ec4b6;
            --danger: #e71d36;
            --text-main: #2b2d42;
            --text-muted: #6c757d;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: var(--card-bg);
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #eee;
            padding: 5px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: #764ba2;
            border-bottom-color: #764ba2;
        }

        .content-section {
            display: none;
            padding: 20px;
            flex-grow: 1;
        }

        .content-section.active {
            display: block;
        }

        .article-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            border: 1px solid #e1e8ed;
        }

        .article-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .article-body {
            padding: 20px;
        }

        .article-tag {
            display: inline-block;
            background: #edf2f7;
            color: #4a5568;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .article-title {
            font-size: 20px;
            margin: 0 0 15px 0;
            line-height: 1.4;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            border: none;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: white;
        }

        .btn-true { background-color: var(--success); }
        .btn-false { background-color: var(--danger); }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .monster-emoji {
            font-size: 64px;
            margin-bottom: 15px;
        }

        .modal-text {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-btn {
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
        }

        .dashboard-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .stat-row:last-child { border-bottom: none; }

        .stat-bar-container {
            width: 100%;
            background: #e2e8f0;
            height: 10px;
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
        }

        .stat-bar {
            background: #764ba2;
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .category-item {
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
        }

        .category-item.selected {
            background: #edf2ff;
            border-color: #4c6ef5;
            color: #4c6ef5;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>פיד החדשות של מתיא</header>
    
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('feed')">חדשות היום</button>
        <button class="tab-btn" onclick="switchTab('dashboard')">השבוע שלי</button>
        <button class="tab-btn" onclick="switchTab('interests')">תחומי עניין</button>
    </div>

    <div id="feed-section" class="content-section active">
        <div id="articles-container">טוען כתבות...</div>
    </div>

    <div id="dashboard-section" class="content-section">
        <h2>סיכום הקריאה השבועי שלך</h2>
        <div id="stats-container"></div>
    </div>

    <div id="interests-section" class="content-section">
        <h2>מה מעניין אותך לקרוא?</h2>
        <div class="category-grid" id="categories-container"></div>
    </div>
</div>

<div class="modal-overlay" id="feedback-modal">
    <div class="modal-card">
        <div class="monster-emoji" id="modal-emoji">👾</div>
        <div class="modal-text" id="modal-text">הודעה</div>
        <button class="modal-btn" id="modal-action-btn" onclick="closeModal()">המשך</button>
    </div>
</div>

<script>
    // הגדרת רשימת הקטגוריות המלאה המבוקשת
    const allCategories = [
        "ספורט", "בעלי חיים", "מדע", "סרטים", "טכנולוגיה", 
        "המצאות בתחום הטבע והסביבה", "בישול", "אסטרונומיה", 
        "משחקי מחשב", "אקטואליה", "בדיחות"
    ];

    // מחסן משפטי הפידבק המדויקים שלך
    const monstersPhrases = {
        correct: [
            { text: "קשה לעבוד עליך!", emoji: "😎" },
            { text: "סחתיין! עליך לא משקרים", emoji: "🦖" },
            { text: "צדקת! זה שקר וכזב!", emoji: "💪" },
            { text: "שקרים סופם להתגלות. כל הכבוד לך!", emoji: "🥇" }
        ],
        incorrect: [
            { text: "?@!נראה לך שזה אמיתי", emoji: "👾" },
            { text: "נו באמת, חתולים לא עפים!", emoji: "🐱" },
            { text: "אי אי אי! נפלת בפח. זו כתבה מזוייפת", emoji: "👹" },
            { text: "אופסי... נפלת בפח", emoji: "💥" },
            { text: "לפעמים קשה להבחין בין אמת לשקר. הפעם לא הצלחת", emoji: "🤷‍♂️" },
            { text: "אזהרה חמורה! זהו שקר שקרי בהחלט!", emoji: "🚨" }
        ]
    };

    let articlesData = [];
    let userInterests = JSON.parse(localStorage.getItem('userInterests')) || [...allCategories];
    let userLog = JSON.parse(localStorage.getItem('userLog')) || [];

    // פונקציה הטוענת את הנתונים ישירות מקובץ ה-data.json שבשרת
    async function loadArticles() {
        try {
            const response = await fetch('data.json');
            const data = await response.json();
            articlesData = data.articles;
            renderFeed();
        } catch (error) {
            document.getElementById('articles-container').innerText = 'שגיאה בטעינת הכתבות.';
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`${tabId}-section`).classList.add('active');
        event.target.classList.add('active');
        if(tabId === 'dashboard') { renderDashboard(); }
    }

    function renderFeed() {
        const container = document.getElementById('articles-container');
        container.innerHTML = '';
        
        const filtered = articlesData.filter(art => userInterests.includes(art.category));
        
        if(filtered.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">אין כתבות להצגה בנושאים שנבחרו.</p>';
            return;
        }

        filtered.forEach(art => {
            const card = document.createElement('div');
            card.className = 'article-card';
            card.innerHTML = `
                <img src="${art.image}" class="article-img" alt="">
                <div class="article-body">
                    <span class="article-tag">${art.category}</span>
                    <h3 class="article-title">${art.title}</h3>
                    <div class="action-buttons">
                        <button class="btn btn-true" onclick="handleAnswer(${art.id}, true)">✔️ אמת</button>
                        <button class="btn btn-false" onclick="handleAnswer(${art.id}, false)">❌ שקר</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    let currentOpenUrl = "";

    function handleAnswer(articleId, clickedTrue) {
        const article = articlesData.find(a => a.id === articleId);
        if(!article) return;

        const isCorrect = (clickedTrue === article.isReal);
        
        userLog.push({ date: new Date().toISOString(), category: article.category });
        localStorage.setItem('userLog', JSON.stringify(userLog));

        let feedback;
        if (isCorrect) {
            feedback = monstersPhrases.correct[Math.floor(Math.random() * monstersPhrases.correct.length)];
            currentOpenUrl = (clickedTrue && article.sourceUrl) ? article.sourceUrl : "";
        } else {
            feedback = monstersPhrases.incorrect[Math.floor(Math.random() * monstersPhrases.incorrect.length)];
            currentOpenUrl = "";
        }

        document.getElementById('modal-emoji').innerText = feedback.emoji;
        document.getElementById('modal-text').innerText = feedback.text;
        
        const actionBtn = document.getElementById('modal-action-btn');
        if (currentOpenUrl) {
            actionBtn.innerText = "המשך לקריאת הכתבה המקורית ➔";
        } else {
            actionBtn.innerText = "הבנתי!";
        }

        document.getElementById('feedback-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('feedback-modal').style.display = 'none';
        if (currentOpenUrl) {
            window.open(currentOpenUrl, '_blank');
            currentOpenUrl = "";
        }
    }

    function renderDashboard() {
        const container = document.getElementById('stats-container');
        container.innerHTML = '';

        const counts = {};
        userLog.forEach(log => {
            counts[log.category] = (counts[log.category] || 0) + 1;
        });

        const total = userLog.length;
        if(total === 0) {
            container.innerHTML = '<p>עדיין לא קראת כתבות השבוע.</p>';
            return;
        }

        Object.keys(counts).forEach(cat => {
            const count = counts[cat];
            const percentage = Math.round((count / total) * 100);
            
            const row = document.createElement('div');
            row.className = 'dashboard-card';
            row.innerHTML = `
                <div class="stat-row">
                    <strong>${cat}</strong>
                    <span>${count} כתבות (${percentage}%)</span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar" style="width: ${percentage}%"></div>
                </div>
            `;
            container.appendChild(row);
        });
    }

    function renderInterests() {
        const container = document.getElementById('categories-container');
        container.innerHTML = '';

        allCategories.forEach(cat => {
            const item = document.createElement('div');
            item.className = `category-item ${userInterests.includes(cat) ? 'selected' : ''}`;
            item.innerText = cat;
            item.onclick = () => {
                if (userInterests.includes(cat)) {
                    userInterests = userInterests.filter(i => i !== cat);
                } else {
                    userInterests.push(cat);
                }
                localStorage.setItem('userInterests', JSON.stringify(userInterests));
                item.classList.toggle('selected');
                renderFeed();
            };
            container.appendChild(item);
        });
    }

    loadArticles();
    renderInterests();
</script>

</body>
</html>
